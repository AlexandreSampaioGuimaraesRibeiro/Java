<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Candidatos</title>
    <html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"></html>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <form method="get" th:action="@{/}" class="filtros">
        <h4 class="text">Buscar por nome / numero</h4> 
        <input type="text" name="texto" th:value="${textoSelecionado}">
        <select name="cargo" id="" disabled="disabled">
            <option value="" th: selected="${cargoSelecionado == ''} ">Todos</option>
            <option th:each="c : ${cargos}"    
            th:value="${c}"
            th:text="${c}"
            th:selected="${c == cargoSelecionado}"></option>
        </select>
        <select name="partido" id="" disabled="disabled">
            <option value="" th: selected="${partidoSelecionado == ''} ">Todos</option>
            <option th:each="p : ${partidos}"    
            th:value="${p}"
            th:text="${p}"
            th:selected="${p == partidoSelecionado}"></option>
        </select> 
    </form>
    <div class="card" th:each="cand : ${candidatos}">
        <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}" 
        th:alt="${cand.nomeUrna}" class="foto-candidato">
        <p class="situacao" th:if="${cand.situacaoCandidatura != null and !card.situacaoCandidatura.isBlank()}"
        th:text="${cand.situacaoCandidatura}">Situaçâo</p>

        <p class="extra" th:if="${cand.idade > 0}">
            <span th:text="${cand.idade + ' anos'}">idade</span>
        </p>
        <p class="extra" th:if="${cand.ocupacao != null and !card.ocupacao.isBlank()}"
        th:text="${cand.ocupacao}">Ocupação</p>

        <p class="extra" th:if="${cand.grauInstrucao != null and !card.grauInstrucao.isBlank()}"
        th:text="${cand.grauInstrucao}">Escolaridade</p>

        <p class="resultado-info">
            <span th:text="${totalEncontrado}">0</span> 
        </p>
        <button type="submit">Filtrar</button> 
        <ath:href="@{/}" class="limpar">Limpar</a> 
    </div>
</body>
</html>
